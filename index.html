<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutriscan - OCR Food Label</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f5f7ff;
            border-color: #764ba2;
        }
        
        .upload-area input[type="file"] {
            display: none;
        }
        
        .upload-label {
            cursor: pointer;
        }
        
        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 12px;
        }
        
        .preview {
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        
        .preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
        }
        
        .preview p {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
            background: #f5f7ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .results h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .nutrition-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .nutrition-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .nutrition-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .nutrition-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }
        
        .raw-text {
            background: white;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
            color: #666;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥗 Nutriscan</h1>
        <p class="subtitle">Quét nhãn thực phẩm và lấy dữ liệu dinh dưỡng tự động</p>
        
        <div class="error" id="error"></div>
        
        <div class="upload-area" id="uploadArea">
            <label class="upload-label" for="fileInput">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Click hoặc kéo ảnh vào đây</div>
                <div class="upload-hint">PNG, JPG, JPEG, GIF, BMP (Max 16MB)</div>
            </label>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="preview" id="preview">
            <img id="previewImage" alt="Preview">
            <p id="fileName"></p>
        </div>
        
        <button id="analyzeBtn" disabled>Phân tích ảnh</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Đang xử lý...</p>
        </div>
        
        <div class="results" id="results">
            <h3>✨ Kết quả</h3>
            <div class="nutrition-grid" id="nutritionGrid"></div>
            <div>
                <h4 style="color: #333; margin-bottom: 10px; font-size: 14px;">📝 Text OCR:</h4>
                <div class="raw-text" id="rawText"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const fileName = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f5f7ff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        // File input change
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                fileName.textContent = file.name;
                preview.style.display = 'block';
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Analyze button
        analyzeBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            analyzeBtn.disabled = true;

            try {
                const response = await fetch('/api/analyze-food', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.nutrition, data.raw_text);
                } else {
                    showError(data.error || 'Lỗi không xác định');
                }
            } catch (err) {
                showError(err.message);
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        });

        function displayResults(nutrition, rawText) {
            const nutritionGrid = document.getElementById('nutritionGrid');
            const rawTextDiv = document.getElementById('rawText');

            nutritionGrid.innerHTML = '';

            const labels = {
                calories: '🔥 Calories',
                fat: '🧈 Fat (g)',
                carb: '🍞 Carbs (g)',
                protein: '💪 Protein (g)'
            };

            for (const [key, label] of Object.entries(labels)) {
                const value = nutrition[key] || 'N/A';
                nutritionGrid.innerHTML += `
                    <div class="nutrition-item">
                        <div class="nutrition-label">${label}</div>
                        <div class="nutrition-value">${value}</div>
                    </div>
                `;
            }

            rawTextDiv.textContent = rawText || 'Không tìm thấy text';
            results.style.display = 'block';
        }

        function showError(msg) {
            error.textContent = '❌ ' + msg;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
